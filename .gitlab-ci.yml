# =====================================================================
# Этот файл кладётся в КАЖДЫЙ репозиторий плагина под именем
# ".gitlab-ci.yml" (в корне репозитория).
#
# Он сам по себе ничего не делает - вся логика сборки/публикации
# лежит в одном общем шаблоне (plugin-pipeline.yml), который хранится
# в отдельном служебном репозитории. Здесь мы просто подключаем этот
# шаблон командой include.
#
# Смысл такого разделения: если понадобится поменять логику CI
# (например, схему именования пакетов) - правится ОДИН файл в
# служебном репозитории, а не переписывается вручную в каждом
# из десятков репозиториев плагинов.
# =====================================================================

include:
  # project - путь к служебному репозиторию с общим шаблоном
  - project: 'tor-dev/infra.revit-ci-templates'
    # ref - какую ветку этого репозитория использовать (обычно main)
    ref: main
    # file - сам файл шаблона внутри указанного репозитория
    file: '/plugin-pipeline.yml'